</head>

<body>
    <!-- Bandeau De Navigation -->
    <nav>
        <img id="bandeau" src="../img/Bandeaux.png" alt="Bandeaux">
        <h1 id="titre">SpeedCircuit</h1>
        <div id="accueil">
            <a href="../../index.html">
                <p>Accueil</p>
            </a>
        </div>
        <div id="information">
            <a href="">
                <p>Informations</p>
            </a>
        </div>
        <div id="reserver">
            <a href="">
                <p>Reserver</p>
            </a>
        </div>
        <div id="evenement">
            <a href="">
                <p>Evenements</p>
            </a>
        </div>

        <div id="compte" class="active_rouge">
            <a href="#">
                <img src="../img/logo_compte.png" alt="Compte">
            </a>
        </div>
    </nav>

    <div id="contenu">
        <h1>Créer un compte</h1>
        <form action="../php/inscription.php" method="post" id="inscription">
            <label for="identifiant">identifiant : </label>
            <input type="text" name="identifiant" id="identifiant">
            <br>
            <label for="nom">Nom : </label>
            <input type="text" name="nom" id="nom">
            <br>
            <label for="prenom">Prénom : </label>
            <input type="text" name="prenom" id="prenom">
            <br>
            <label for="age">Age : </label>
            <input type="number" name="age" id="age" min="18" max="99">
            <br>
            <label for="mail">Adresse mail : </label>
            <input type="email" name="mail" id="mail">
            <br>
            <label for="mdp">Mot de passe : </label>
            <input type="password" name="mdp" id="mdp">
            <br>
            <label for="confirm_mdp">Confirmation du mot de passe</label>
            <input type="password" name="confirm_mdp" id="confirm_mdp">
            <br>
            <input type="submit" value="Inscription">
        </form>
    </div>
    <script src="../js/inscription.js"></script>
</body>
