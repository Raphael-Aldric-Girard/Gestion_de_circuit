<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservation</title>
    <link rel="stylesheet" href="../css/reservation.css">
    <link rel="stylesheet" href="../css/base.css">
</head>
<body>
    <!-- Bandeau De Navigation -->
    <nav>
        <img id="bandeau" src="../img/Bandeaux.png" alt="Bandeaux">
        <h1 id="titre">SpeedCircuit</h1>
        <div id="accueil">
            <a href="../../index.html">
                <p>Accueil</p>
            </a>
        </div>
        <div id="information">
            <a href="informationsCircuit.html">
                <p>Informations</p>
            </a>
        </div>
        <div id="reserver" class="active_rouge">
            <a href="reservation.html">
                <p>Reserver</p>
            </a>
        </div>
        <div id="evenement">
            <a href="">
                <p>Evenements</p>
            </a>
        </div>

        <div id="compte">
            <a href="authentification.html">
                <img src="../img/logo_compte.png" alt="Compte">
            </a>
        </div>
    </nav>

    <main class="mainContent">
        <div class="carDisplayPanel">
            <div class="Selection">
                <label class="radioOption">
                    <input type="button" name="locationOption" value="voiture">
                </label>
                <label class="radioOption">
                    <input type="button" name="locationOption" value="moto" checked>
                </label>
            </div>
            <div class="panelHeader">
                <span>Flotte disponible</span>
                <span id="compteurVoitures" style="font-size: 0.8rem; font-weight: 400; color: #666;">Chargement...</span>
            </div>

            <div class="carListScrollContainer">
                <div class="carGrid" id="grilleVoitures"></div>
            </div>
        </div>

        <div class="reservationPanel">
            <h2 class="formTitle">Réservation</h2>
            <form action="traitement_reservation.php" method="POST" class="inputGroup">
                <input type="date" name="date" class="inputField">
                <input type="time" name="heure" class="inputField">
                
                <div class="radioGroup">
                    <label class="radioOption">
                        <input type="radio" name="locationOption" value="sans">
                        Sans location
                    </label>
                    <label class="radioOption">
                        <input type="radio" name="locationOption" value="avec" checked>
                        Avec location
                    </label>
                </div>

                <input type="text" id="selectedCar" name="vehicule" class="inputField" placeholder="Cliquez sur une voiture..." readonly>
                
                <button type="submit" class="submitButton">Réserver</button>
            </form>
        </div>

    </main>
    <script src="../js/reservation.js"></script>
</body>
</html>
